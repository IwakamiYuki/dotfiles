git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --true-color=auto --dark --side-by-side --line-numbers
gui:
  # オレンジ系カラースキーム（vim/tmuxと統一）
  theme:
    activeBorderColor:
      - '#ff8700' # オレンジ（ANSI 208相当）
      - bold
    inactiveBorderColor:
      - '#6c6c6c' # グレー
    selectedLineBgColor:
      - '#3a3a3a' # ダークグレー背景
    cherryPickedCommitBgColor:
      - '#ff8700'
    cherryPickedCommitFgColor:
      - '#000000'
    unstagedChangesColor:
      - '#ff8700' # オレンジ
  # ウィンドウサイズ
  screenMode: 'normal'
  scrollHeight: 2
  scrollPastBottom: true
  mouseEvents: true
  skipStashWarning: false
  showFileTree: true
  showListFooter: true
  showRandomTip: false
  showBranchCommitHash: true
  showBottomLine: true
  showPanelJumps: true
  showCommandLog: false
  showIcons: true
  nerdFontsVersion: "3"
  # コミットメッセージ長
  commitLength:
    show: true
  # スキップ設定
  skipRewordInEditorWarning: false
  skipNoStagedFilesWarning: false
  skipDiscardChangeWarning: false
customCommands:
  - key: 'A'
    context: 'files'
    description: 'AI生成コミットメッセージでコミット (対話的)'
    command: '/bin/bash ~/dotfiles/lazygit/ai-commit.sh'
    output: 'terminal'
  - key: 'n'
    context: 'worktrees'
    description: '命名規則に従ってWorktreeを作成'
    prompts:
      - type: 'input'
        title: 'ブランチ名を入力 (例: feature/new-feature)'
        key: 'TaskName'
    command: '/bin/bash ~/dotfiles/bin/create-worktree {{ .Form.TaskName | quote }}'
    loadingText: 'Worktreeを作成中...'
# Conventional Commitsプリセット
os:
  editPreset: 'nvim'
# 更新チェック無効化（dotfilesで管理するため）
update:
  method: 'never'
# リフレッシュモード
refresher:
  refreshInterval: 10
  fetchInterval: 60
